       <script id="facebook-script" type="text/javascript">
           window.onload = function() {
               setTimeout(function() {

                   
                   var alternateAction = document.querySelector('.ulp-alternate-action');
                   if (alternateAction) {
                       var clonedElement = alternateAction.cloneNode(true);
                       var paragraph = clonedElement.querySelector('p');
                       var link = clonedElement.querySelector('a');
                       if (paragraph && link) {
                           var newHref = link.href + '#fb-recovery';
                           paragraph.innerHTML = '¿Iniciabas con Facebook? <a class="' + link.className + '" href="' + newHref + '">Recupera tu cuenta aquí</a>';
                   }
                       var formContainer = alternateAction.parentElement;
                       if (formContainer) {
                           formContainer.appendChild(clonedElement);
                   }
               }
                   

                   

           }, 500);
       };
